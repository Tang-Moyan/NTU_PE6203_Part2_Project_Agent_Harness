[project]
name = "agent-harness-approval-gate"
version = "0.1.0"
description = "Three-way Approval Policy Gate for Agent Tool Execution in AgentDojo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "numpy>=1.22.0",
    "openai>=1.10.0",
]

[project.optional-dependencies]
agentdojo = ["agentdojo==0.1.35"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
